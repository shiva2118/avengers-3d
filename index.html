<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sync App (Max 5 Users)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 400px;
        }
        input, button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }
        input {
            width: 80%;
        }
        button {
            background-color: #1DB954;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #1ed760;
        }
        #status {
            font-weight: bold;
            color: #1ed760;
            margin-top: 15px;
        }
    </style>
    <!-- Include PeerJS library from CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <h1>Music Sync</h1>
    <p id="status">Connecting to network...</p>

    <!-- HOST SECTION -->
    <div class="card" id="hostSection" style="display:none;">
        <h3>Host a Session</h3>
        <p>Your Room ID:</p>
        <h2 id="my-peer-id" style="color: #1DB954;">Generating...</h2>
        <p id="memberCount">Connected Members: 1 / 5</p>
        <input type="file" id="audioUpload" accept="audio/*"><br>
        <audio id="audioPlayer" controls style="width:100%; margin-top:15px;"></audio>
    </div>

    <!-- JOIN SECTION -->
    <div class="card" id="joinSection">
        <h3>Join a Session</h3>
        <input type="text" id="joinIdInput" placeholder="Enter Host Room ID"><br>
        <button id="joinBtn">Connect to Host</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const hostSection = document.getElementById('hostSection');
        const joinSection = document.getElementById('joinSection');
        const myPeerIdEl = document.getElementById('my-peer-id');
        const memberCountEl = document.getElementById('memberCount');
        const joinIdInput = document.getElementById('joinIdInput');
        const joinBtn = document.getElementById('joinBtn');
        const audioUpload = document.getElementById('audioUpload');
        const audioPlayer = document.getElementById('audioPlayer');

        let peer = new Peer();
        let connectedClients = []; // Keeps track of connected peers (Max 4 clients + 1 host = 5 total)
        let conn = null;
        const MAX_MEMBERS = 5;

        peer.on('open', (id) => {
            statusEl.innerText = "Connected! Choose an option below:";
            myPeerIdEl.innerText = id;
            hostSection.style.display = 'block';
        });

        // Host listens for incoming connections
        peer.on('connection', (connection) => {
            if (connectedClients.length >= MAX_MEMBERS - 1) {
                // Room is full, reject/close connection
                connection.on('open', () => {
                    connection.send({ type: 'error', message: 'Room is full! Maximum 5 members allowed.' });
                    setTimeout(() => connection.close(), 500);
                });
                return;
            }

            connectedClients.push(connection);
            updateMemberCount();
            statusEl.innerText = "A new device has joined your room!";

            connection.on('close', () => {
                connectedClients = connectedClients.filter(c => c !== connection);
                updateMemberCount();
            });

            setupHostListeners();
        });

        function updateMemberCount() {
            const totalMembers = connectedClients.length + 1;
            memberCountEl.innerText = `Connected Members: ${totalMembers} / ${MAX_MEMBERS}`;
        }

        // Client joins a host
        joinBtn.addEventListener('click', () => {
            const hostId = joinIdInput.value.trim();
            if (!hostId) {
                alert('Please enter a valid Host Room ID');
                return;
            }
            
            statusEl.innerText = "Connecting to host...";
            conn = peer.connect(hostId);

            conn.on('open', () => {
                statusEl.innerText = "Connected to Host successfully!";
                joinSection.style.display = 'none';
            });

            conn.on('data', (data) => {
                if (data.type === 'error') {
                    alert(data.message);
                    statusEl.innerText = data.message;
                    window.location.reload();
                } else {
                    handleClientData(data);
                }
            });
        });

        // Audio file loading for host
        audioUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                audioPlayer.src = fileURL;
                audioPlayer.load();
                statusEl.innerText = "Song loaded on host!";
            }
        });

        function setupHostListeners() {
            audioPlayer.onplay = () => {
                broadcast({ type: 'play', currentTime: audioPlayer.currentTime });
            };
            audioPlayer.onpause = () => {
                broadcast({ type: 'pause', currentTime: audioPlayer.currentTime });
            };
        }

        function broadcast(data) {
            connectedClients.forEach(client => {
                client.send(data);
            });
        }

        function handleClientData(data) {
            if (data.type === 'play') {
                audioPlayer.currentTime = data.currentTime;
                audioPlayer.play();
            } else if (data.type === 'pause') {
                audioPlayer.pause();
            }
        }
    </script>

</body>
</html>
