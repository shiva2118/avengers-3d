<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D FPP Archery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px;
            pointer-events: none; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 14px; height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; pointer-events: none;
        }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            font-size: 28px;
        }
    </style>
    <!-- Three.js (Lightweight 3D Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Playgama SDK for YouTube Playables -->
    <script src="https://cdn.jsdelivr.net/npm/@playgama/bridge@1.3.0/dist/playgama-bridge.js"></script>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="timer">Time: 30s</div>
</div>
<div id="crosshair"></div>
<div id="canvas-container"></div>

<div id="game-over">
    <h1 style="color: #ff4757; font-size: 48px;">TIME'S UP!</h1>
    <p id="final-score" style="margin: 20px 0;">Final Score: 0</p>
    <p style="font-size: 18px; color: #00fff0;">Tap or Click to Play Again</p>
</div>

<script>
// Playgama Integration
let bridge = window.playgama ? window.playgama.bridge : null;
if (bridge) {
    bridge.init().then(() => { bridge.platform.sendMessage('game_ready'); }).catch(console.error);
}

// Scene Setup
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky blue
scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 0); // FPP Eye level (1.6m)

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
scene.add(dirLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Archery Target Board Construction
const targetGroup = new THREE.Group();

function createTargetRing(radius, color, depth) {
    const geo = new THREE.CylinderGeometry(radius, radius, depth, 32);
    const mat = new THREE.MeshStandardMaterial({ color: color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = Math.PI / 2;
    mesh.receiveShadow = true;
    return mesh;
}

const ringWhite  = createTargetRing(1.2, 0xffffff, 0.1);
const ringBlack  = createTargetRing(0.96, 0x111111, 0.12);
const ringBlue   = createTargetRing(0.72, 0x00a8ff, 0.14);
const ringRed    = createTargetRing(0.48, 0xe84118, 0.16);
const ringYellow = createTargetRing(0.24, 0xfbc531, 0.18);

targetGroup.add(ringWhite, ringBlack, ringBlue, ringRed, ringYellow);

// Stand
const standGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.5);
const standMat = new THREE.MeshStandardMaterial({ color: 0x574b90 });
const leg1 = new THREE.Mesh(standGeo, standMat);
leg1.position.set(-0.6, -0.6, -0.2); leg1.rotation.z = -0.3;
const leg2 = new THREE.Mesh(standGeo, standMat);
leg2.position.set(0.6, -0.6, -0.2); leg2.rotation.z = 0.3;
targetGroup.add(leg1, leg2);

targetGroup.position.set(0, 1.8, -25); // Set target 25 meters ahead
scene.add(targetGroup);

// First Person Bow Setup (Held in hand)
const bowGroup = new THREE.Group();

const limbMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.3 });
const upperLimbGeo = new THREE.CylinderGeometry(0.02, 0.03, 0.8);
const upperLimb = new THREE.Mesh(upperLimbGeo, limbMat);
upperLimb.position.set(0, 0.35, -0.05); upperLimb.rotation.x = -0.2;

const lowerLimb = new THREE.Mesh(upperLimbGeo, limbMat);
lowerLimb.position.set(0, -0.35, -0.05); lowerLimb.rotation.x = 0.2;

const gripGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.25);
const gripMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const grip = new THREE.Mesh(gripGeo, gripMat);

bowGroup.add(upperLimb, lowerLimb, grip);
bowGroup.position.set(0.3, -0.3, -0.6); // Lower right in FPP view
camera.add(bowGroup);
scene.add(camera);

// Arrow Creator
function createArrowMesh() {
    const arrow = new THREE.Group();
    const shaftGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.8);
    const shaftMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
    const shaft = new THREE.Mesh(shaftGeo, shaftMat);
    shaft.rotation.x = Math.PI / 2;

    const tipGeo = new THREE.ConeGeometry(0.02, 0.1, 8);
    const tipMat = new THREE.MeshStandardMaterial({ color: 0x718093, metalness: 0.8 });
    const tip = new THREE.Mesh(tipGeo, tipMat);
    tip.rotation.x = -Math.PI / 2;
    tip.position.z = -0.45;

    arrow.add(shaft, tip);
    return arrow;
}

// Game State & Physics Variables
let score = 0;
let timeLeft = 30;
let gameOver = false;
let isDrawing = false;
let drawPower = 0;
let activeArrows = [];

// Aim Controls (Mouse / Touch)
let pitch = 0, yaw = 0;
window.addEventListener('mousemove', (e) => {
    if (gameOver) return;
    if (document.pointerLockElement === document.body) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, pitch));
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
    }
});

window.addEventListener('click', () => {
    if (gameOver) {
        resetGame();
        return;
    }
    if (document.pointerLockElement !== document.body) {
        document.body.requestPointerLock();
    }
});

// Shooting Controls
window.addEventListener('mousedown', (e) => {
    if (e.button === 0 && !gameOver && document.pointerLockElement === document.body) {
        isDrawing = true;
        drawPower = 0;
    }
});

window.addEventListener('mouseup', (e) => {
    if (e.button === 0 && isDrawing && !gameOver) {
        shootArrow(drawPower);
        isDrawing = false;
        drawPower = 0;
        bowGroup.position.z = -0.6; // Reset bow position
    }
});

function shootArrow(power) {
    const arrow = createArrowMesh();
    arrow.position.copy(camera.position);

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    arrow.quaternion.copy(camera.quaternion);

    const speed = Math.max(12, power * 38);
    activeArrows.push({
        mesh: arrow,
        velocity: dir.multiplyScalar(speed),
        inFlight: true
    });

    scene.add(arrow);
}

function resetGame() {
    score = 0;
    timeLeft = 30;
    gameOver = false;
    document.getElementById('score').innerText = "Score: 0";
    document.getElementById('game-over').style.display = 'none';
    
    activeArrows.forEach(a => scene.remove(a.mesh));
    activeArrows = [];
    document.body.requestPointerLock();
}

// Timer Loop
setInterval(() => {
    if (!gameOver && timeLeft > 0) {
        timeLeft--;
        document.getElementById('timer').innerText = `Time: ${timeLeft}s`;
        if (timeLeft === 0) {
            gameOver = true;
            document.exitPointerLock();
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
            document.getElementById('game-over').style.display = 'flex';
            if (bridge && bridge.advertisement) {
                bridge.advertisement.showInterstitial();
            }
        }
    }
}, 1000);

// Main Game Loop
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Pull Bow Back Effect
    if (isDrawing && drawPower < 1) {
        drawPower += delta * 1.5;
        bowGroup.position.z = -0.6 + (drawPower * 0.15); // Pull closer to camera
    }

    // Arrow Physics and Collision Detection
    activeArrows.forEach(a => {
        if (a.inFlight) {
            a.velocity.y -= 4.9 * delta; // Gravity
            a.mesh.position.addScaledVector(a.velocity, delta);

            // Orient Arrow along flight path
            const nextPos = a.mesh.position.clone().add(a.velocity);
            a.mesh.lookAt(nextPos);

            // Target Hit Check
            const distZ = Math.abs(a.mesh.position.z - targetGroup.position.z);
            if (distZ < 0.3 && a.mesh.position.z < targetGroup.position.z + 0.2) {
                const hitX = a.mesh.position.x - targetGroup.position.x;
                const hitY = a.mesh.position.y - targetGroup.position.y;
                const distance = Math.sqrt(hitX * hitX + hitY * hitY);

                if (distance <= 1.2) {
                    a.inFlight = false; // Stick arrow into board

                    // Calculate Score Rings
                    let points = 0;
                    if (distance < 0.24) points = 10;
                    else if (distance < 0.48) points = 8;
                    else if (distance < 0.72) points = 6;
                    else if (distance < 0.96) points = 4;
                    else points = 2;

                    score += points;
                    document.getElementById('score').innerText = `Score: ${score}`;
                }
            }

            // Ground Collision
            if (a.mesh.position.y <= 0.05) {
                a.inFlight = false;
            }
        }
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
