<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Bottle Shooter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #fff; font-family: system-ui, sans-serif; text-align: center; overflow: hidden; }
        canvas { background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); display: block; margin: 0 auto; touch-action: none; cursor: crosshair; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@playgama/bridge@1.3.0/dist/playgama-bridge.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
let bridge = window.playgama ? window.playgama.bridge : null;
if (bridge) {
    bridge.init().then(() => { bridge.platform.sendMessage('game_ready'); }).catch(err => console.error(err));
}

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = Math.min(window.innerWidth, 450);
    canvas.height = Math.min(window.innerHeight, 800);
}
window.addEventListener("resize", resize);
resize();

let score = 0;
let timeLeft = 30;
let gameOver = false;
let bottles = [];
let particles = [];
let gunFlashes = [];

// Realistic 3D Pseudo-Glass Bottle
class Bottle3D {
    constructor() {
        this.w = 46;
        this.h = 90;
        this.x = Math.random() * (canvas.width - this.w);
        this.y = canvas.height + 20;
        this.speedY = -(Math.random() * 4 + 9);
        this.speedX = (Math.random() - 0.5) * 3;
        this.rotation = (Math.random() - 0.5) * 0.4;
        this.rotSpeed = (Math.random() - 0.5) * 0.05;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedY += 0.18; // Gravity
        this.rotation += this.rotSpeed;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        ctx.rotate(this.rotation);

        // Glass Body Gradient (3D Cylindrical Shading)
        let bodyGrad = ctx.createLinearGradient(-this.w / 2, 0, this.w / 2, 0);
        bodyGrad.addColorStop(0, "rgba(0, 150, 130, 0.9)");
        bodyGrad.addColorStop(0.2, "rgba(0, 230, 200, 1)");
        bodyGrad.addColorStop(0.5, "rgba(255, 255, 255, 0.8)"); // 3D Light Highlight
        bodyGrad.addColorStop(0.8, "rgba(0, 180, 150, 1)");
        bodyGrad.addColorStop(1, "rgba(0, 70, 60, 0.95)");

        // Draw Main Body
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.roundRect(-this.w / 2, -this.h / 2 + 25, this.w, this.h - 25, 8);
        ctx.fill();

        // Neck Gradient
        let neckGrad = ctx.createLinearGradient(-10, 0, 10, 0);
        neckGrad.addColorStop(0, "#007a6e");
        neckGrad.addColorStop(0.4, "#00fff0");
        neckGrad.addColorStop(1, "#003b35");

        // Draw Neck & Shoulder
        ctx.fillStyle = neckGrad;
        ctx.beginPath();
        ctx.moveTo(-this.w / 2 + 4, -this.h / 2 + 25);
        ctx.lineTo(-10, -this.h / 2 + 8);
        ctx.lineTo(-10, -this.h / 2);
        ctx.lineTo(10, -this.h / 2);
        ctx.lineTo(10, -this.h / 2 + 8);
        ctx.lineTo(this.w / 2 - 4, -this.h / 2 + 25);
        ctx.fill();

        // Metallic Cap (3D Chrome)
        let capGrad = ctx.createLinearGradient(-11, 0, 11, 0);
        capGrad.addColorStop(0, "#888");
        capGrad.addColorStop(0.5, "#fff");
        capGrad.addColorStop(1, "#333");
        ctx.fillStyle = capGrad;
        ctx.fillRect(-11, -this.h / 2 - 5, 22, 6);

        // Outer Glass Rim Reflection
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-this.w / 2 + 2, -this.h / 2 + 27, this.w - 4, this.h - 29);

        ctx.restore();
    }
}

// Particle system for Glass Shatter & Gun Muzzle Flash
class Particle {
    constructor(x, y, color, size, speedX, speedY) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.speedX = speedX;
        this.speedY = speedY;
        this.alpha = 1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= 0.03;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function spawnBottle() {
    if (!gameOver) {
        bottles.push(new Bottle3D());
        setTimeout(spawnBottle, Math.random() * 700 + 400);
    }
}

// Gun Shot FX
function createGunFire(targetX, targetY) {
    const gunX = canvas.width / 2;
    const gunY = canvas.height;

    // Tracer / Bullet Line
    gunFlashes.push({
        x1: gunX, y1: gunY, x2: targetX, y2: targetY, alpha: 1
    });

    // Muzzle Smoke & Spark Fire
    for (let i = 0; i < 8; i++) {
        particles.push(new Particle(
            targetX, targetY,
            Math.random() > 0.5 ? "#fffa65" : "#ff4d4d",
            Math.random() * 4 + 2,
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6
        ));
    }
}

function shatterBottle(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push(new Particle(
            x, y,
            Math.random() > 0.3 ? "#00fff0" : "#ffffff",
            Math.random() * 5 + 2,
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10
        ));
    }
}

function shoot(e) {
    if (gameOver) {
        resetGame();
        return;
    }

    const rect = canvas.getBoundingClientRect();
    const clickX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const clickY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

    createGunFire(clickX, clickY);

    bottles.forEach((b, index) => {
        if (clickX >= b.x && clickX <= b.x + b.w && clickY >= b.y && clickY <= b.y + b.h) {
            score += 10;
            shatterBottle(b.x + b.w / 2, b.y + b.h / 2);
            bottles.splice(index, 1);
        }
    });
}

canvas.addEventListener("mousedown", shoot);
canvas.addEventListener("touchstart", shoot);

function resetGame() {
    score = 0;
    timeLeft = 30;
    gameOver = false;
    bottles = [];
    particles = [];
    spawnBottle();
}

setInterval(() => {
    if (!gameOver && timeLeft > 0) {
        timeLeft--;
        if (timeLeft === 0) {
            gameOver = true;
            if (bridge && bridge.advertisement) {
                bridge.advertisement.showInterstitial();
            }
        }
    }
}, 1000);

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        // Render & update bottles
        bottles.forEach((b, i) => {
            b.update();
            b.draw();
            if (b.y > canvas.height + 100) bottles.splice(i, 1);
        });

        // Render Bullet Tracers
        gunFlashes.forEach((f, i) => {
            ctx.strokeStyle = `rgba(255, 230, 100, ${f.alpha})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(f.x1, f.y1);
            ctx.lineTo(f.x2, f.y2);
            ctx.stroke();
            f.alpha -= 0.15;
            if (f.alpha <= 0) gunFlashes.splice(i, 1);
        });

        // Render Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.alpha <= 0) particles.splice(i, 1);
        });

        // Dashboard UI
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(`Score: ${score}`, 20, 40);
        ctx.fillText(`Time: ${timeLeft}s`, canvas.width - 120, 40);
    } else {
        ctx.fillStyle = "#ff4757";
        ctx.font = "bold 32px sans-serif";
        ctx.fillText("GAME OVER", canvas.width / 2 - 95, canvas.height / 2 - 20);
        ctx.fillStyle = "#fff";
        ctx.font = "20px sans-serif";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2 - 65, canvas.height / 2 + 20);
        ctx.fillStyle = "#00fff0";
        ctx.fillText("Tap to Play Again", canvas.width / 2 - 75, canvas.height / 2 + 65);
    }

    requestAnimationFrame(update);
}

spawnBottle();
update();
</script>
</body>
</html>
