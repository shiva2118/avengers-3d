<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sync App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 400px;
        }
        input, button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }
        input {
            width: 80%;
        }
        button {
            background-color: #1DB954;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #1ed760;
        }
        #status {
            font-weight: bold;
            color: #1ed760;
            margin-top: 15px;
        }
    </style>
    <!-- Include PeerJS library from CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <h1>Music Sync</h1>
    <p id="status">Connecting to network...</p>

    <!-- HOST SECTION -->
    <div class="card" id="hostSection" style="display:none;">
        <h3>Host a Session</h3>
        <p>Your Room ID:</p>
        <h2 id="my-peer-id" style="color: #1DB954;">Generating...</h2>
        <p id="memberCount">Connected Members: 1 / 5</p>
        <input type="file" id="audioUpload" accept="audio/*"><br>
        <audio id="audioPlayer" controls style="width:100%; margin-top:15px;"></audio>
    </div>

    <!-- JOIN SECTION -->
    <div class="card" id="joinSection">
        <h3>Join a Session</h3>
        <input type="text" id="joinIdInput" placeholder="Enter Host Room ID"><br>
        <button id="joinBtn">Connect to Host</button>
    </div>

    <!-- CLIENT PLAYBACK CONTROLS (Hidden until connected) -->
    <div class="card" id="clientSection" style="display:none;">
        <h3>Joined Room</h3>
        <p id="clientStatus">Waiting for host song...</p>
        <button id="unlockAudioBtn">Tap to Enable Sound</button>
        <audio id="clientAudioPlayer" style="width:100%; margin-top:15px;" controls></audio>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const hostSection = document.getElementById('hostSection');
        const joinSection = document.getElementById('joinSection');
        const clientSection = document.getElementById('clientSection');
        const myPeerIdEl = document.getElementById('my-peer-id');
        const memberCountEl = document.getElementById('memberCount');
        const joinIdInput = document.getElementById('joinIdInput');
        const joinBtn = document.getElementById('joinBtn');
        const unlockAudioBtn = document.getElementById('unlockAudioBtn');
        const audioUpload = document.getElementById('audioUpload');
        const audioPlayer = document.getElementById('audioPlayer');
        const clientAudioPlayer = document.getElementById('clientAudioPlayer');
        const clientStatus = document.getElementById('clientStatus');

        let peer = new Peer();
        let connectedClients = [];
        let conn = null;
        const MAX_MEMBERS = 5;
        let audioFileBuffer = null;
        let audioFileName = "";

        peer.on('open', (id) => {
            statusEl.innerText = "Connected! Choose an option below:";
            myPeerIdEl.innerText = id;
            hostSection.style.display = 'block';
        });

        // Host listens for connections
        peer.on('connection', (connection) => {
            if (connectedClients.length >= MAX_MEMBERS - 1) {
                connection.on('open', () => {
                    connection.send({ type: 'error', message: 'Room is full! Maximum 5 members allowed.' });
                    setTimeout(() => connection.close(), 500);
                });
                return;
            }

            connectedClients.push(connection);
            updateMemberCount();
            statusEl.innerText = "A new device has joined your room!";

            if (audioFileBuffer) {
                connection.on('open', () => {
                    connection.send({
                        type: 'file-transfer',
                        fileData: audioFileBuffer,
                        fileName: audioFileName
                    });
                });
            }

            connection.on('close', () => {
                connectedClients = connectedClients.filter(c => c !== connection);
                updateMemberCount();
            });

            setupHostListeners();
        });

        function updateMemberCount() {
            const totalMembers = connectedClients.length + 1;
            memberCountEl.innerText = `Connected Members: ${totalMembers} / ${MAX_MEMBERS}`;
        }

        // Client joins host
        joinBtn.addEventListener('click', () => {
            const hostId = joinIdInput.value.trim();
            if (!hostId) {
                alert('Please enter a valid Host Room ID');
                return;
            }
            
            statusEl.innerText = "Connecting to host...";
            conn = peer.connect(hostId);

            conn.on('open', () => {
                statusEl.innerText = "Connected to Host successfully!";
                joinSection.style.display = 'none';
                clientSection.style.display = 'block'; // Show client audio box
            });

            conn.on('data', (data) => {
                if (data.type === 'error') {
                    alert(data.message);
                    statusEl.innerText = data.message;
                    window.location.reload();
                } else {
                    handleClientData(data);
                }
            });
        });

        // Unlock audio restriction on mobile browsers via user tap
        unlockAudioBtn.addEventListener('click', () => {
            clientAudioPlayer.play().then(() => {
                clientAudioPlayer.pause();
                clientAudioPlayer.currentTime = 0;
                unlockAudioBtn.style.display = 'none';
                clientStatus.innerText = "Sound enabled! Ready to sync.";
            }).catch(err => {
                alert("Please select a song/interact first.");
            });
        });

        // Host loads song
        audioUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                audioFileName = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    audioFileBuffer = e.target.result;
                    const fileURL = URL.createObjectURL(file);
                    audioPlayer.src = fileURL;
                    audioPlayer.load();
                    statusEl.innerText = "Song loaded and broadcasting!";

                    broadcast({
                        type: 'file-transfer',
                        fileData: audioFileBuffer,
                        fileName: audioFileName
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function setupHostListeners() {
            audioPlayer.onplay = () => {
                broadcast({ type: 'play', currentTime: audioPlayer.currentTime });
            };
            audioPlayer.onpause = () => {
                broadcast({ type: 'pause', currentTime: audioPlayer.currentTime });
            };
        }

        function broadcast(data) {
            connectedClients.forEach(client => {
                client.send(data);
            });
        }

        function handleClientData(data) {
            if (data.type === 'file-transfer') {
                const blob = new Blob([data.fileData], { type: 'audio/mp3' });
                const fileURL = URL.createObjectURL(blob);
                clientAudioPlayer.src = fileURL;
                clientAudioPlayer.load();
                clientStatus.innerText = `Song loaded: ${data.fileName}`;
            } else if (data.type === 'play') {
                clientAudioPlayer.currentTime = data.currentTime;
                clientAudioPlayer.play().catch(e => {
                    console.log("Autoplay blocked, tap 'Tap to Enable Sound'");
                });
                clientStatus.innerText = "Playing in sync!";
            } else if (data.type === 'pause') {
                clientAudioPlayer.pause();
                clientStatus.innerText = "Paused by host.";
            }
        }
    </script>

</body>
</html>
